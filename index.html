<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
        <title>Home</title>
    </head>

    <body>
      <form action="#" method="get">
        <label for="email">
            Email:
            <input type="email" id="email" name="email" inputmode>
        </label>

        <label for="website">
            Website:
            <input type="url" id="website" name="website" autocomplete>
        </label>

        <button type="submit">Submit</button>
    </form>

    </body>

</html>
