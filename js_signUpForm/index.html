<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>signUpForm</title>
</head>
<body>
    <div class="left-page">
        <div class="text-background">
            <span>
                <img src="./images/odin-lined.png" alt="logo icon">
                ODIN
            </span>
        </div>
        <div class="credits">
            <p>
                Photo by <a href="https://unsplash.com/@rhweht">Rafael Hoyos Weht</a>
                on <a href="https://unsplash.com/">Unsplash</a>.
            </p>
        </div>
    </div>

    <div class="right-page">
        <div class="top-section">
            <div class="top-cont">
                <h1>This is not a real online service! You know you need something <br> like this in your life to help you realize your deepest dreams. <br> Sing up now to get started.</h1>
                <br>
                <h1 class="h1">You <em>know</em> you want to.</h1>
            </div>
        </div>
        <div class="mid-section">
            <div class="mid-cont">
                <h2>Let's do this!</h2>
                <form action="#" method="#">
                    <div class="f-sec-1">
                        <div>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name">
                        </div>
                        <div>
                            <label for="mail">EMAIL</label>
                            <input type="email" id="mail" name="mail">
                        </div>
                        <div>
                            <label for="pwd">PASSWORD</label>
                            <input type="password" id="pwd" name="pwd" required minlength="4" title="Includes at least 4 characters.">
                        </div>
                    </div>
                    <div class="f-sec-2">
                        <div>
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name">
                        </div>
                        <div>
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" id="phone-number" name="phone-number" maxlength="11">
                        </div>
                        <div>
                            <label for="confirm-pwd">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-pwd" name="confirm-pwd" required minlength="4">
                        </div>
                    </div>

                </form>
            </div>
        </div>
        <div class="bottom-section">
            <div class="bottom-cont">
                <button>Create Account</button>
                <p><br>Already have an account? <a href="#" style="font-weight: bold; text-decoration: none;">Log in</a>.</p>
            </div>
        </div>
    </div>
</body>
</html>
