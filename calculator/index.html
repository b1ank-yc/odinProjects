<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>calculator</title>
</head>
<body>

    <div class="container">
            
        <div class="screen"></div>

        <div class="row1">
            <div class="opk">AC</div>
            <div class="opk">C</div>
            <div class="opk">-></div>
            <div class="op">/</div>
        </div>

        <div class="row2">
            <div class="btn">7</div>
            <div class="btn">8</div>
            <div class="btn">9</div>
            <div class="op">*</div>
        </div>

        <div class="row3">
            <div class="btn">4</div>
            <div class="btn">5</div>
            <div class="btn">6</div>
            <div class="op">-</div>
        </div>

        <div class="row4">
            <div class="btn">1</div>
            <div class="btn">2</div>
            <div class="btn">3</div>
            <div class="op">+</div>
        </div>

        <div class="row5">
            <div class="btn btn-special">0</div>
            <div class="btn">.</div>
            <div class="eq">=</div>
        </div>

    </div>

</body>
</html>
